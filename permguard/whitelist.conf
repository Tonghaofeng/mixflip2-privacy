# permguard 白名单 —「默认拒绝」：第三方 App 的隐私权限，除下面写明允许的组外，每轮都收回。
# 改完：adb 版 `permguard/adb/permguard.sh --dry-run` 先看清单；手机端 App 内置一份同样的，
#       要覆盖就 `adb push whitelist.conf /sdcard/Android/data/uk.tonytong.permguard/files/whitelist.conf`（下一轮生效）。
#
# 格式：包名  允许的组（逗号分隔；* = 全部、整个包不碰；- = 什么都不给）  # 注释
# 组：  LOCATION（前台定位）LOCATION_BG（后台定位，隐含前台）CONTACTS（含 GET_ACCOUNTS）CALL_LOG SMS PHONE
#       CAMERA MICROPHONE CALENDAR SENSORS ACTIVITY（活动识别）MEDIA（照片视频音频/存储）
#       MEDIA_LOCATION（读照片里的 GPS）NEARBY（蓝牙/附近 Wi-Fi/UWB）INSTALLED_APPS（小米获取应用列表：权限 + MIUI op 10022）
#       USAGE_STATS（使用情况访问 + MIUI 获取运行中应用 10019）ALL_FILES（所有文件访问）CLIPBOARD（读剪贴板）
#       AUTOSTART（MIUI 自启动 10008）BG_START（MIUI 后台弹出界面 10021）
#       AD_ID（MIUI 广告/设备标识：OAID 10037、10038、匿名 ID 10024、10025、10050）SCREEN（MIUI AI 读屏/操控 10054、10055）
#       OTHER（不认识的运行时权限）
#   MIUI 的「*_REAL」op（10028–10032、10036、10043）、发彩信 10004、运营商取号 10039、通话录音 10046、后台定位 10027
#   跟着对应的运行时权限组走（SMS/CONTACTS/CALENDAR/CALL_LOG/PHONE/LOCATION/MICROPHONE/LOCATION_BG）。
# 通知权限 POST_NOTIFICATIONS 不算隐私，永远不收。
#
# 白名单只表示「不收」，永远不会主动授予——没授予的权限照样没有。
# 不在白名单里的权限被收回后，App 下次要用时会重新弹窗；你点允许，它就有到下一轮（≤6 小时）为止 =「临时授权」。
#
# 自动保留（不用写在这里）：
#   · 带 GRANTED_BY_ROLE 标志且该包当前持有默认角色（拨号/短信/助理/浏览器/桌面…，`cmd role get-role-holders`）的权限
#   · SYSTEM_FIXED / POLICY_FIXED 的权限（shell 本来就收不了，只报告）
#   · 系统 App 一律只报告不改；要收某个系统 App，写 `@manage 包名`（先逐个评估风险）
#   · 硬编码豁免（不读本文件也生效）：Clash Meta、Shizuku、permguard 自身

# —— 只报告不收的组（默认 OTHER 与 CLIPBOARD）。
# CLIPBOARD：Android 10+ 已禁止后台 App 读剪贴板（只剩前台 App 与默认输入法）；把它设成 ignore 会让所有 App 粘贴失效，
#   所以默认只报告。要强制收，把下一行改成 `@enforce CLIPBOARD`，再给要粘贴的 App 加 CLIPBOARD。
@report OTHER CLIPBOARD

# —— 豁免：整包不碰 ————————————————————————————————————————————————
com.github.metacubex.clash.meta      *    # Clash Meta：always-on+锁定 VPN，动它整机断网（硬编码也豁免）
moe.shizuku.privileged.api           *    # Shizuku：手机端执行通道
uk.tonytong.permguard                *    # 本工具

# —— 默认角色与系统级通讯（角色权限已自动保留，这里补角色之外、功能必需的）————————
uk.tonytong.aios                     MICROPHONE,SMS,CONTACTS,CALL_LOG,PHONE,CALENDAR,LOCATION,LOCATION_BG  # AIOS 自建助手(默认数字助理):语音唤起/读写消息/日历/定位(本机 API,见 aios-phone 项目)
com.google.android.dialer            CONTACTS,CALL_LOG,PHONE,MICROPHONE,SMS        # 默认拨号（READ_PHONE_NUMBERS 是手动给的，不在角色里）
com.google.android.apps.messaging    SMS,CONTACTS,PHONE,CAMERA,MICROPHONE,MEDIA   # 默认短信
com.google.android.contacts          CONTACTS,PHONE                               # 通讯录 App 本体
com.google.android.calendar          CALENDAR                                     # 日历 App 本体（共享 UID）
com.google.android.ims               PHONE,SMS                                    # 运营商服务（RCS），目前未授予
com.google.android.inputmethod.latin -                                            # Gboard：键盘看得到所有输入，不给任何隐私权限
com.android.chrome                   -                                            # 默认浏览器：网站要定位/相机时再临时给

